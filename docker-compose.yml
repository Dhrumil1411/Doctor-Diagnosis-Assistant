services:
  db:
    image: postgres:17-alpine
    container_name: dda-postgres
    environment:
      POSTGRES_USER: dda
      POSTGRES_PASSWORD: dda
      POSTGRES_DB: dda
    ports:
      - "5432:5432"
    volumes:
      - dda_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dda -d dda"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  dda_pgdata:
