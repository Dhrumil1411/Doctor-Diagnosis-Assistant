# Render Blueprint Specification (render.yaml)
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: dda-db
    plan: starter
    databaseName: dda
    user: dda
    ipAllowList: [] # internal only

services:
  # 1. FastAPI Backend API
  - type: web
    name: dda-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dda-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: CORS_ORIGINS
        value: "*"
      - key: SEED_DEMO
        value: "true"
      - key: DEMO_DOCTOR_PASSWORD
        generateValue: true
      - key: DEMO_READONLY_PASSWORD
        generateValue: true
      - key: DEMO_ADMIN_PASSWORD
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

  # 2. React + Vite Frontend (Static Site on Global CDN)
  - type: web
    name: dda-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_DEMO_MODE
        value: "true"
      - key: VITE_API_URL
        sync: false # Set to https://<your-dda-backend-url>.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
